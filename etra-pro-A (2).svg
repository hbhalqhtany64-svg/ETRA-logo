<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7A4EF5"/>
      <stop offset="0.5" stop-color="#5234B7"/>
      <stop offset="1" stop-color="#2B1678"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.2" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4D8FF"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFA6FF"/>
      <stop offset="1" stop-color="#8A5FF0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#1A0A55" flood-opacity="0.55"/>
    </filter>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#B79CFF" stop-opacity="0.45"/><stop offset="1" stop-color="#B79CFF" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="236" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="236" fill="url(#hl)"/>
  <circle cx="512" cy="540" r="380" fill="url(#aura)"/>
  <!-- stem (behind) -->
  <rect x="297" y="270" width="120" height="484" fill="url(#stem)"/>
  <!-- layered bars -->
  <g filter="url(#drop)">
    <path d="M297 270 H727 L687 360 H297 Z" fill="url(#bar)"/>
    <path d="M297 421 H637 L597 513 H297 Z" fill="url(#bar)"/>
    <path d="M297 664 H727 L687 754 H297 Z" fill="url(#bar)"/>
  </g>
